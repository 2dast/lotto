name: Lotto Predictor

on:
  schedule:
    - cron: "10 12 * * 6" # 매주 토요일 21:10 KST (UTC 12:10)
    - cron: "10 14 * * 6" # 매주 토요일 23:10 KST (UTC 14:10) — API 반영 지연 대비 재시도
    - cron: "0 0 * * 0" # 매주 일요일 09:00 KST (UTC 00:00) — 최종 재시도
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "RULES.md"
      - "RULES_2.md"
      - "astro-app/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: astro-app/package-lock.json

      - name: Install dependencies
        working-directory: astro-app
        run: npm ci

      - name: Run tests
        working-directory: astro-app
        run: npm test

      # astro build의 Content Layer 로더가 draws 수집·예측 생성·저장까지 전부 수행한다
      # (draws-loader.ts, predictions-loader.ts). 실패해도 기존 데이터로 폴백하므로
      # 이 스텝 자체가 실패하는 경우는 코드 버그일 때뿐이다.
      # 같은 회차 예측이 이미 있으면 건너뛴다. 수동 실행(workflow_dispatch)만 새 세트를 추가로 만든다.
      - name: Build site
        working-directory: astro-app
        env:
          FORCE_PREDICT: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run build

      # 방금 만든 dist를 astro preview로 서빙해 드로어·테마·가로 스크롤을 검증한다 (빌드는 다시 하지 않는다).
      - name: Install Playwright browser
        working-directory: astro-app
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: astro-app
        run: npm run test:e2e

      - name: Update README
        working-directory: astro-app
        run: node scripts/update-readme.mjs

      # 수집이 API 실패로 폴백했으면 최신 회차가 기대값보다 뒤처진다. 커밋·배포 전에 실패시켜 조용한 성공을 막는다.
      - name: Verify latest draw is up to date
        working-directory: astro-app
        run: node scripts/check-latest-draw.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/draws.json predictions/ README.md
          git diff --cached --quiet || git commit -m "chore: update lotto data and predictions"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: astro-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
