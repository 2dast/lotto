name: Lotto Predictor

on:
  schedule:
    - cron: "10 12 * * 6" # 매주 토요일 21:10 KST (UTC 12:10)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Collect latest draws
        run: python scripts/collect.py

      - name: Generate predictions
        run: python scripts/predict.py

      - name: Update README
        run: python scripts/update_readme.py

      - name: Generate analysis report
        run: python scripts/generate_report.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/draws.json predictions/ README.md reports/
          git diff --cached --quiet || git commit -m "chore: update lotto data and predictions"
          git push
